<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E POWER SOLUTION</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.header h1{
  margin:0;
  font-size:28px;
  letter-spacing:1px;
}

.header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 12px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.product-image{
  width:100%;
  min-height:250px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:#777;
}

.product-image img{
  width:100%;
  height:auto;
  display:block;
}

.info{
  padding:20px;
}

.offer{
  display:inline-block;
  background:#ef4444;
  color:white;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

h2{
  margin:12px 0;
  font-size:24px;
}

.old-price{
  color:#888;
  text-decoration:line-through;
  font-size:18px;
}

.new-price{
  font-size:30px;
  font-weight:bold;
  margin:5px 0 18px;
}

.quantity{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:12px;
  background:white;
}

.order-button{
  width:100%;
  display:block;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

.footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>E POWER SOLUTION</h1>
  <p>Quality Electronics & Lighting Solutions</p>
</div>


<div class="container">

<!-- PRODUCT 1 -->

<div class="product">

  <div class="product-image">
    <span>Emergency Light</span>
  </div>

  <div class="info">

    <span class="offer">SPECIAL OFFER</span>

    <h2>Emergency Light</h2>

    <div class="old-price">৳790</div>
    <div class="new-price">৳599</div>

    <select class="quantity" id="qty1">
      <option value="1">Quantity: 1</option>
      <option value="2">Quantity: 2</option>
      <option value="3">Quantity: 3</option>
      <option value="4">Quantity: 4</option>
      <option value="5">Quantity: 5</option>
      <option value="6">Quantity: 6</option>
      <option value="7">Quantity: 7</option>
      <option value="8">Quantity: 8</option>
      <option value="9">Quantity: 9</option>
      <option value="10">Quantity: 10</option>
    </select>

    <button class="order-button" onclick="orderProduct('Emergency Light',599,'qty1')">
      ORDER NOW
    </button>

  </div>
</div>


<!-- PRODUCT 2 -->

<div class="product">

  <div class="product-image">
    <span>LED Light</span>
  </div>

  <div class="info">

    <span class="offer">SPECIAL OFFER</span>

    <h2>LED Light</h2>

    <div class="old-price">৳990</div>
    <div class="new-price">৳799</div>

    <select class="quantity" id="qty2">
      <option value="1">Quantity: 1</option>
      <option value="2">Quantity: 2</option>
      <option value="3">Quantity: 3</option>
      <option value="4">Quantity: 4</option>
      <option value="5">Quantity: 5</option>
      <option value="6">Quantity: 6</option>
      <option value="7">Quantity: 7</option>
      <option value="8">Quantity: 8</option>
      <option value="9">Quantity: 9</option>
      <option value="10">Quantity: 10</option>
    </select>

    <button class="order-button" onclick="orderProduct('LED Light',799,'qty2')">
      ORDER NOW
    </button>

  </div>
</div>

</div>


<div class="footer">
  © 2026 E POWER SOLUTION
</div>


<script>

function orderProduct(product,price,quantityId){

  let quantity =
    document.getElementById(quantityId).value;

  let total = price * quantity;

  let message =
    "আমি অর্ডার করতে চাই\n\n" +
    "পণ্য: " + product + "\n" +
    "দাম: ৳" + price + "\n" +
    "পরিমাণ: " + quantity + "\n" +
    "মোট: ৳" + total;

  let whatsapp =
    "https://wa.me/8801857140164?text=" +
    encodeURIComponent(message);

  window.open(whatsapp,"_blank");
}

</script>

</body>
</html>
